name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias y compilar web
        run: |
          npm ci || npm install
          npm run build

      - name: Crear y sincronizar proyecto Capacitor iOS
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init RunSinDolor com.stephen.runsindolor --web-dir=dist
          fi
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Generar AppIcon iOS desde public/icon.svg
        run: |
          mkdir -p /tmp/icon-gen
          npm install --prefix /tmp/icon-gen @resvg/resvg-js
          NODE_PATH=/tmp/icon-gen/node_modules node -e '
            const fs = require("fs");
            const { Resvg } = require("@resvg/resvg-js");
            let svg = fs.readFileSync("public/icon.svg", "utf8").replace(/rx="[^"]*"/, "");
            const resvg = new Resvg(svg, { fitTo: { mode: "width", value: 1024 }, background: "#ffffff" });
            const dir = "ios/App/App/Assets.xcassets/AppIcon.appiconset";
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(dir + "/AppIcon-512@2x.png", resvg.render().asPng());
            fs.writeFileSync(dir + "/Contents.json", JSON.stringify({
              images: [{ filename: "AppIcon-512@2x.png", idiom: "universal", platform: "ios", size: "1024x1024" }],
              info: { author: "xcode", version: 1 }
            }, null, 2));
          '

      - name: Instalar CocoaPods si aplica
        run: |
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
            pod install
          fi

      - name: Compilar app iOS sin firma
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r RunSinDolor-iOS.ipa Payload

      - name: Guardar .ipa para descargar
        uses: actions/upload-artifact@v4
        with:
          name: RunSinDolor-iOS-IPA
          path: RunSinDolor-iOS.ipa
